# =============================================================================
# Policy-0 Staging Docker Compose - GPU Capable
# =============================================================================
# Staging environment with GPU support for Isaac Sim + Isaac Lab
# Requires: NVIDIA Container Toolkit, nvidia-docker2
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Main Application
  # ---------------------------------------------------------------------------
  policy0:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: policy0-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - PORT=2009
      - DATA_DIR=/app/data
      - EXPORTS_DIR=/app/exports
      - UPLOADS_DIR=/app/uploads
      # Database
      - DATABASE_URL=postgresql://policy0:${POSTGRES_PASSWORD}@postgres:5432/policy0
      - DATA_BACKEND=postgres
      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - POLICY0_API_KEY=${POLICY0_API_KEY}
      # NVIDIA Stack - Staging uses OSMO for GPU orchestration
      - USE_COSMOS_VLM=true
      - USE_NIM_LLM=true
      - USE_ISAAC_SIM=true
      - USE_ISAAC_LAB=true
      - USE_ISAAC_SIM_RTX=true
      - USE_LEAPP_EXPORT=true
      - USE_ISAAC_ROS=true
      - USE_OSMO=true
      - WAIT_FOR_ISAAC_SIM=false
      # NVIDIA API
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_BASE=https://api.nvidia.com
      # Cosmos VLM
      - COSMOS_NIM_ENDPOINT=https://api.nvidia.com/v1/cosmos/reasoner
      # NIM LLM
      - NIM_LLM_ENDPOINT=https://api.nvidia.com/v1/nim/llama-3-70b
      # Isaac Sim (local GPU)
      - ISAAC_SIM_ENDPOINT=http://isaac-sim:8211
      # Isaac Lab (local GPU)
      - ISAAC_LAB_ENDPOINT=http://isaac-lab:8212
      # OSMO orchestration
      - OSMO_ENDPOINT=https://api.nvidia.com/v1/osmo
      - OSMO_LOCAL_SIM=true
      # Logging
      - LOG_LEVEL=info
    ports:
      - "2009:2009"
    volumes:
      - policy0-data:/app/data
      - policy0-exports:/app/exports
      - policy0-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2009/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: policy0-postgres-staging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=policy0
      - POSTGRES_USER=policy0
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - staging-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy0 -d policy0"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # ---------------------------------------------------------------------------
  # Isaac Sim (GPU)
  # ---------------------------------------------------------------------------
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:2024.1
    container_name: policy0-isaac-sim-staging
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - HEADLESS=1
    volumes:
      - isaac-sim-cache:/isaac-sim/kit/cache
      - policy0-exports:/app/exports
      - policy0-uploads:/app/uploads
    networks:
      - staging-internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8211/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Isaac Lab (GPU)
  # ---------------------------------------------------------------------------
  isaac-lab:
    image: nvcr.io/nvidia/isaac-lab:2024.1
    container_name: policy0-isaac-lab-staging
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - HEADLESS=1
    volumes:
      - isaac-lab-cache:/workspace/isaac-lab/cache
      - policy0-exports:/app/exports
    networks:
      - staging-internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8212/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: policy0-prometheus-staging
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - staging-internal

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: policy0-grafana-staging
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000/grafana/
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - staging-internal
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy + SSL
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: policy0-nginx-staging
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - staging-internal
    depends_on:
      - policy0
      - grafana

networks:
  staging-internal:
    driver: bridge

volumes:
  policy0-data:
    driver: local
  policy0-exports:
    driver: local
  policy0-uploads:
    driver: local
  isaac-sim-cache:
    driver: local
  isaac-lab-cache:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local